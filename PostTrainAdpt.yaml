seed: 0
model:
  pretrained: ???  # set to the ConR ckpt.best.pth.tar
  bandwidth: 2                 # h of the Gaussian label kernel (label units, e.g. years)
  condLoss: w2                 # conditional error distribution N(mu, sigma^2) vs target N(0, sigma_ref^2):
                               #   w2: mu^2 + (sigma - sigma_ref)^2 | l1: |mu| + |sigma - sigma_ref| | kl: KL(N(mu, sigma^2) || N(0, sigma_ref^2)) | skl: symmetric KL, (KL(P||Q) + KL(Q||P)) / 2
  sigmaFloor: 1.0              # kl/skl only: sigma = sqrt(var + sigmaFloor^2), label units; stops 1/sigma^2 blow-ups
  minNeighbors: 3              # kl/skl only: skip anchors whose kernel row has < this many effective samples
  l2spWeight: 1.0              # weight of the L2-SP penalty ||w - w0||^2 toward the pretrained weights
  feature_dim:                 # inferred: 512 for ResNet18, 2048 for ResNet50

  backbone:
    target: conr_backbone.Encoder
    params:
      name: auto               # inferred from checkpoint; explicit resnet18/resnet50 must match
      
  optim:
    name: adam                 # adam | sgd (momentum 0.9) | adamw; added to the output folder name
    param: all                 # all: encoder and head (L2-SP on both) | backbone: all encoder weights
                               # | backbone_bn: BatchNorm affine only (ResNets) | backbone_norm: BatchNorm + LayerNorm affine (ViTs)
    lr: 0.0005
    weight_decay: 0.           # keep 0: L2-SP replaces weight decay

logger:
  project_name: AgeDB
  run_name: ConR_PostTrainAdpt
  save_dir: 
  # Model selection on validation: keep the top_k epochs with the highest val DC (signed; positive allowed),
  # then load the one with the lowest val MAE among them (saved as checkpoints/best-model-*.ckpt).
  # DC = corr(pred - true, true): usually negative (regression to the mean), so higher = less bias
  top_k: 5
  # top-k candidate file names; fields: epoch, val_dc, val_abs_dc, val_mae, test_dc, test_abs_dc, test_mae (str.format)
  save_name: topk-epoch{epoch:02d}-valDC{val_dc:+.4f}-valMAE{val_mae:.3f}
  max_abs_dc: 0.05     # epochs with |val DC| <= this rank above all others and the best model is picked
                       # among them; falls back to the unconstrained rule if none qualifies. Leave empty to disable.
  save_start: 0        # first epoch eligible as a candidate
  save_train_predictions: true   # also save train_before.csv / train_after.csv (source 'train' split, no augmentation)

dataset:
  name: auto                  # source training.log dataset; or agedb | imdb_wiki
  data_folder: auto           # source training.log data_dir; explicit paths override auto
  data_csv: auto              # source training.log data_csv (same split as source evaluation)
  normalization: auto         # source imagenet_pretrained: imagenet | conr (mean/std 0.5)
  img_size: auto              # source training.log img_size; current models require 224
  adaptation_split: val
  num_workers: 8
  label_name: 'age'
  aug: "crop,flip"
  batch_size: 64               # added to the output folder name (_bsz:<batch_size>)
  balance:                     # label-balanced adaptation batches (training only; val/test stay natural)
    enabled: false
    alpha: 1.0                 # bin share ~ n_bin^(1 - alpha): 1 = flat over bins, 0 = natural, 0.5 = compromise
    num_bins: 10               # equal-width label bins; each batch gets a quota from every non-empty bin
    seed: 0

trainer:
  accelerator: gpu
  devices: 1
  max_steps: 2000
  max_epochs: 500000
  precision: 32-true
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  deterministic: False
  benchmark: True
  fast_dev_run: False
  limit_train_batches: 1.0 # set to debug

